<!DOCTYPE html>
<html>
<head>
    <title>HTML Events Example</title>
</head>
<body>

<h1>Event Demonstration</h1>

<button onclick="alert('Button clicked!')">Click me</button>

<p onmouseover="this.style.color='pink'" onmouseout="this.style.color='black'">
    Hover over this text
</p>

<script>
    window.onload = function() {
        alert("Page loaded!");
    };
</script>

</body>
</html>
